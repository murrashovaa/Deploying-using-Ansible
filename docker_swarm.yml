---
- name: Deploy Docker Swarm on single node via ansible-pull
  hosts: localhost
  become: yes
  vars:
    swarm_advertise_addr: "{{ ansible_default_ipv4.address }}"
    
  tasks:
    - name: Update package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker
      apt:
        name:
          - docker.io
          - docker-compose
        state: present

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Initialize Docker Swarm
      community.docker.docker_swarm:
        state: present
        advertise_addr: "{{ swarm_advertise_addr }}"
        listen_addr: "0.0.0.0"

    - name: Deploy test stack
      community.docker.docker_stack:
        state: present
        name: web
        compose:
          - version: '3'
            services:
              web:
                image: nginx:alpine
                ports:
                  - "80:80"
                deploy:
                  replicas: 1