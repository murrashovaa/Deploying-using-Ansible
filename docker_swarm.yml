---
- name: Установка Docker и настройка Docker Swarm
  hosts: all
  become: yes
  vars:
    swarm_advertise_addr: "{{ ansible_host }}"
  
  tasks:
    - name: Remove conflicting Docker packages
      apt:
        name:
          - docker
          - docker.io
          - docker-engine
          - containerd
          - runc
        state: absent
      ignore_errors: yes

    - name: Установить Docker
      include_role:
        name: docker_install

- name: Инициализация Swarm на менеджере
  hosts: manager
  become: yes
  tasks:
    - name: Инициализация Swarm с указанием адреса
      community.docker.docker_swarm:
        state: present
        advertise_addr: "{{ ansible_host }}"
        listen_addr: "0.0.0.0"
      register: swarm_info

    - name: Получение токена для рабочих узлов
      ansible.builtin.command: docker swarm join-token worker -q
      register: worker_join_token

    - name: Вывод токена  
      ansible.builtin.debug:
        msg: "Join token: {{ worker_join_token.stdout }}"

    - name: Передать токен и IP рабочим узлам
      ansible.builtin.add_host:
        name: join_info_host
        groups: swarm_joiners
        swarm_join_token: "{{ worker_join_token.stdout }}"
        manager_ip: "{{ ansible_host }}"  # Используем IP из инвентаря
      run_once: yes

- name: Присоединение рабочих узлов к Swarm
  hosts: workers
  become: yes
  tasks:
    - name: Покинуть Swarm, если узел уже в нём
      ansible.builtin.command: docker swarm leave --force
      ignore_errors: yes

    - name: Присоединение к Swarm как рабочий узел
      ansible.builtin.command: >
        docker swarm join
        --token {{ hostvars['join_info_host'].swarm_join_token }}
        {{ hostvars['join_info_host'].manager_ip }}:2377
      when: 
        - "'join_info_host' in hostvars"
        - "hostvars['join_info_host'].swarm_join_token is defined"